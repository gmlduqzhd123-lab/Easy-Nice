# v1.0.1 같은 태그를 올리면 Windows 설치 파일을 만들어 GitHub Releases 에 올린다.
# 설치된 앱은 이 Releases 를 보고 자동 업데이트한다.
name: Release installer

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 태그와 package.json 버전 확인
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "태그($GITHUB_REF_NAME)와 package.json 버전(v$v)이 달라요."; exit 1
          fi
      - name: 저장소 설정 확인
        shell: bash
        run: node -e "const r=require('./repo.config.json'); if(!r.owner||!r.repo){console.error('repo.config.json 의 owner/repo 를 채워 주세요.');process.exit(1)}"
      - run: npm ci
      - run: npm test
      # electron-builder 가 파일을 동시에 올리다 같은 태그의 릴리스를 둘 만드는 일이 있어서,
      # 같은 태그의 릴리스를 모두 지우고 하나를 먼저 만들어 둔다.
      - name: 릴리스 준비
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/releases"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          for id in $(curl -s "${auth[@]}" "$api?per_page=100" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{for(const r of JSON.parse(d))if(r.tag_name===process.env.GITHUB_REF_NAME)console.log(r.id)})"); do
            curl -s -X DELETE "${auth[@]}" "$api/$id"
          done
          curl -sf -X POST "${auth[@]}" "$api" -d "{\"tag_name\":\"$GITHUB_REF_NAME\",\"name\":\"${GITHUB_REF_NAME#v}\",\"draft\":true}" > /dev/null
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 릴리스 공개 및 확인
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/releases"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          ids=$(curl -s "${auth[@]}" "$api?per_page=100" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const rs=JSON.parse(d).filter(r=>r.tag_name===process.env.GITHUB_REF_NAME);for(const r of rs)console.error(r.id,r.draft,r.assets.map(a=>a.name).join(','));if(rs.length!==1||!rs[0].assets.some(a=>a.name==='neis-input-helper-setup.exe')||!rs[0].assets.some(a=>a.name==='latest.yml')){console.error('릴리스가 하나가 아니거나 파일이 빠졌어요.');process.exit(1)}console.log(rs[0].id)})")
          curl -sf -X PATCH "${auth[@]}" "$api/$ids" -d '{"draft":false,"make_latest":"true"}' > /dev/null
